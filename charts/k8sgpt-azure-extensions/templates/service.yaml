apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8sgpt-azure-extensions.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8sgpt-azure-extensions.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "k8sgpt-azure-extensions.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 8081
      targetPort: 8081
      protocol: TCP
