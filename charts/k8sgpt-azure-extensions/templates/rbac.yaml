{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8sgpt-azure-extensions.fullname" . }}
  labels:
    {{- include "k8sgpt-azure-extensions.labels" . | nindent 4 }}
rules:
  # ExtensionConfig CRDs (both AKS and Arc API groups)
  - apiGroups: ["aks.clusterconfig.azure.com"]
    resources: ["extensionconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["clusterconfig.azure.com"]
    resources: ["extensionconfigs", "extensionevents", "configsyncstatuses",
                "healthstates", "arccertificates", "azureclusteridentityrequests",
                "azureextensionidentities", "agentconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aks.clusterconfig.azure.com"]
    resources: ["configsyncstatuses"]
    verbs: ["get", "list", "watch"]
  # Core resources for diagnostics
  - apiGroups: [""]
    resources: ["namespaces", "pods", "pods/log", "services", "endpoints", "events", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  # Secrets — read-only, only for checking existence of identity certs
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8sgpt-azure-extensions.fullname" . }}
  labels:
    {{- include "k8sgpt-azure-extensions.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8sgpt-azure-extensions.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
