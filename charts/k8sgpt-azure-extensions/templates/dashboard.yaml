apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8sgpt-azure-extensions.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8sgpt-azure-extensions.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8sgpt-azure-extensions-dashboard
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8sgpt-azure-extensions-dashboard
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: K8SGPT_API_URL
              value: "http://{{ include "k8sgpt-azure-extensions.fullname" . }}:8080"
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8sgpt-azure-extensions.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8sgpt-azure-extensions.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: k8sgpt-azure-extensions-dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8501
      targetPort: 8501
      protocol: TCP
