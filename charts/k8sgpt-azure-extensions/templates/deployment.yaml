{{- $secretName := "" }}
{{- if .Values.ai_secret.existingSecretName }}
{{- $secretName = .Values.ai_secret.existingSecretName }}
{{- else if .Values.ai_secret.aiPassword }}
{{- $secretName = printf "%s-ai-secret" (include "k8sgpt-azure-extensions.fullname" .) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8sgpt-azure-extensions.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8sgpt-azure-extensions.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "k8sgpt-azure-extensions.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8sgpt-azure-extensions.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      initContainers:
        - name: init-integration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/k8sgpt"]
          args: ["integrations", "activate", "azureextensions", "--no-install"]
          env:
            - name: XDG_CONFIG_HOME
              value: /tmp/k8sgpt-config
          volumeMounts:
            - name: config-dir
              mountPath: /tmp/k8sgpt-config
        - name: init-auth
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/k8sgpt"]
          args:
            - auth
            - add
            - --backend
            - {{ .Values.ai.backend }}
            - --model
            - {{ .Values.ai.model }}
            {{- if .Values.ai.baseUrl }}
            - --baseurl
            - {{ .Values.ai.baseUrl }}
            {{- end }}
            {{- if .Values.ai.engine }}
            - --engine
            - {{ .Values.ai.engine }}
            {{- end }}
            - --password
            - $(K8SGPT_PASSWORD)
          env:
            - name: XDG_CONFIG_HOME
              value: /tmp/k8sgpt-config
            {{- if $secretName }}
            - name: K8SGPT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .Values.ai_secret.existingSecretKey | default "api-key" }}
            {{- end }}
          volumeMounts:
            - name: config-dir
              mountPath: /tmp/k8sgpt-config
        - name: init-default
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/k8sgpt"]
          args: ["auth", "default", "--provider", "{{ .Values.ai.backend }}"]
          env:
            - name: XDG_CONFIG_HOME
              value: /tmp/k8sgpt-config
          volumeMounts:
            - name: config-dir
              mountPath: /tmp/k8sgpt-config
      containers:
        - name: k8sgpt
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --http
            - --backend
            - {{ .Values.ai.backend }}
            {{- range (splitList "," .Values.analyze.filters) }}
            - --filter={{ . | trim }}
            {{- end }}
          env:
            - name: XDG_CONFIG_HOME
              value: /tmp/k8sgpt-config
          volumeMounts:
            - name: config-dir
              mountPath: /tmp/k8sgpt-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config-dir
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
